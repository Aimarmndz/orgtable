# Only these packages may run install scripts (pnpm 11 blocks the rest). Prisma needs
# to download the schema-engine used by `migrate deploy`.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: false
  unrs-resolver: false

# Force patched versions of transitive dependencies with security advisories, always
# within the same major version. Review when bumping next, prisma or
# eslint-config-next: if they already ship the fixed version, drop the line.
overrides:
  brace-expansion@>=3.0.0 <5.0.9: ^5.0.12
  browserslist@<4.28.7: ^4.28.7
  mysql2@<3.23.1: ^3.23.1
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2

auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8 (via @prisma/config): stack overflow when merging recursive
    # graphs. It only merges the local prisma.config.ts config, which is not user input.
    # The fix requires deepmerge-ts 8 (major); remove this once on a prisma that ships
    # it. See docs/DECISIONES.md (2026-09-24).
    - GHSA-ggr8-5vv4-36mx
