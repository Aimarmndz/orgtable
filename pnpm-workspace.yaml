# Solo estos paquetes pueden ejecutar scripts de instalación (pnpm 11 bloquea el
# resto). Prisma necesita descargar el schema-engine que usa `migrate deploy`.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: false
  unrs-resolver: false

# Fuerza versiones parcheadas de dependencias transitivas con avisos de seguridad,
# siempre dentro de la misma versión mayor. Revisar al subir next, prisma o
# eslint-config-next: si ya traen la versión corregida, se quita la línea.
overrides:
  brace-expansion@>=3.0.0 <5.0.9: ^5.0.12
  browserslist@<4.28.7: ^4.28.7
  mysql2@<3.23.1: ^3.23.1

auditConfig:
  ignoreGhsas:
    # deepmerge-ts <8 (vía @prisma/config): desbordamiento de pila al fusionar grafos
    # recursivos. Solo fusiona la configuración local de prisma.config.ts, que no es
    # entrada de usuario. El parche exige deepmerge-ts 8 (mayor); se quita al subir a
    # un prisma que lo incluya. Ver docs/DECISIONES.md (2026-09-24).
    - GHSA-ggr8-5vv4-36mx
