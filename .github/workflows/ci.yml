name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llegan pushes seguidos al mismo ref, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # DATABASE_URL ficticia: el cliente Prisma se instancia de forma perezosa y el
      # build solo compila (las rutas son dinámicas, no se conecta a la BD). No se
      # ejecutan migraciones ni seed en CI.
      DATABASE_URL: postgresql://orgtable:orgtable@localhost:5432/orgtable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
