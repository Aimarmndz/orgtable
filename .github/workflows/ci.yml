name: CI

on:
  push:
    branches: [main]
  pull_request:

# If several pushes arrive for the same ref, cancel the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL for the integration tests. The database is called
    # `orgtable_test` (the test guard requires the name to end in `_test`).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orgtable
          POSTGRES_PASSWORD: orgtable
          POSTGRES_DB: orgtable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgtable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points at the service Postgres. The build does not connect (dynamic routes); the
      # integration tests do, and `prisma migrate deploy` creates the schema there.
      DATABASE_URL: postgresql://orgtable:orgtable@localhost:5432/orgtable_test

    steps:
      - uses: actions/checkout@v5

      # shellcheck ships with ubuntu-latest. The ops scripts touch production data
      # (backups, restore), so a shell error must not slip through.
      - name: Shellcheck
        run: shellcheck scripts/*.sh install.sh docker-entrypoint.sh

      # The app container only receives the variables listed under `environment:`. If one
      # is dropped from the compose file, the feature that depends on it silently stops
      # working in Docker (e.g. without CRON_SECRET reminders always answer 503).
      - name: Check compose passes env vars to app
        run: |
          config="$(CRON_SECRET=probe TRUSTED_PROXY_HOPS=7 ORGTABLE_TIMEZONE=Europe/Madrid \
            ORGTABLE_AUDIT_RETENTION_DAYS=45 ORGTABLE_SOURCE_URL=https://example.org/fork \
            ORGTABLE_LANDING=on ORGTABLE_INSTALL_URL=https://example.org/fork/install.sh \
            ORGTABLE_SMTP_URL=smtp://probe ORGTABLE_PUBLIC_URL=https://example.org \
            docker compose config)"
          grep -q 'CRON_SECRET: probe' <<<"$config"
          grep -q 'TRUSTED_PROXY_HOPS: "7"' <<<"$config"
          grep -q 'ORGTABLE_TIMEZONE: Europe/Madrid' <<<"$config"
          grep -q 'ORGTABLE_AUDIT_RETENTION_DAYS: "45"' <<<"$config"
          grep -q 'ORGTABLE_SOURCE_URL: https://example.org/fork' <<<"$config"
          # "on" is a YAML 1.1 boolean, so compose quotes it; single or double depends on
          # the compose version.
          grep -Eq "ORGTABLE_LANDING: ['\"]on['\"]" <<<"$config"
          grep -q 'ORGTABLE_INSTALL_URL: https://example.org/fork/install.sh' <<<"$config"
          grep -q 'ORGTABLE_SMTP_URL: smtp://probe' <<<"$config"
          grep -q 'ORGTABLE_PUBLIC_URL: https://example.org' <<<"$config"

      # The current license is AGPL-3.0-or-later with an attribution term (section 7(b))
      # at the end of LICENSE (see docs/DECISIONES.md, 2026-10-14). Fails if package.json
      # and LICENSE stop matching, if the attribution term is lost, or if leftovers of
      # the proprietary license reappear outside the historical record.
      - name: Check license
        run: |
          grep -q '"license": "AGPL-3.0-or-later"' package.json
          head -n 1 LICENSE | grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE'
          grep -q 'ADDITIONAL TERMS UNDER SECTION 7(b) OF THE GNU AGPL' LICENSE
          grep -q 'Created by Aimar (github.com/Aimarmndz)' LICENSE
          if git grep -n -E 'MARA-KASSA|UNLICENSED|[Tt]odos los derechos reservados' -- \
            ':!docs/decisions/0005-agpl.md' ':!docs/decisions/0016-licencia-propietaria.md' \
            ':!docs/DECISIONES.md' ':!.github/workflows/ci.yml' ':!CLAUDE.md'; then
            echo "Leftovers of the previous license remain (the current one is in LICENSE)." >&2
            exit 1
          fi

      # Installs the pnpm version pinned in `packageManager` (package.json).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on high or critical vulnerabilities in production dependencies.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Builds the production image from the committed tree only, as a deployment does.
      # A path the Dockerfile copies but git does not track (an empty public/ only
      # exists on a developer's machine) breaks the deploy and not the steps above.
      - name: Docker image
        run: docker build --tag orgtable:ci .
