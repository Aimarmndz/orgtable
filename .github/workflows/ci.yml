name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llegan pushes seguidos al mismo ref, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL efímero para los tests de integración. La base de datos se llama
    # `orgtable_test` (el guardia de los tests exige que acabe en `_test`).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orgtable
          POSTGRES_PASSWORD: orgtable
          POSTGRES_DB: orgtable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgtable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Apunta al Postgres de servicio. El build no se conecta (rutas dinámicas); los
      # tests de integración sí, y `prisma migrate deploy` crea el esquema ahí.
      DATABASE_URL: postgresql://orgtable:orgtable@localhost:5432/orgtable_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
