name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llegan pushes seguidos al mismo ref, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL efímero para los tests de integración. La base de datos se llama
    # `orgtable_test` (el guardia de los tests exige que acabe en `_test`).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orgtable
          POSTGRES_PASSWORD: orgtable
          POSTGRES_DB: orgtable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgtable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Apunta al Postgres de servicio. El build no se conecta (rutas dinámicas); los
      # tests de integración sí, y `prisma migrate deploy` crea el esquema ahí.
      DATABASE_URL: postgresql://orgtable:orgtable@localhost:5432/orgtable_test

    steps:
      - uses: actions/checkout@v5

      # shellcheck viene instalado en ubuntu-latest. Los scripts de operación tocan datos
      # de producción (backups, restauración), así que un error de shell no puede pasar.
      - name: Shellcheck
        run: shellcheck scripts/*.sh install.sh docker-entrypoint.sh

      # El contenedor app solo recibe las variables listadas en `environment:`. Si alguna
      # se cae del compose, la función que depende de ella deja de funcionar en Docker sin
      # ningún error (p. ej. sin CRON_SECRET los recordatorios responden siempre 503).
      - name: Check compose passes env vars to app
        run: |
          config="$(CRON_SECRET=probe TRUSTED_PROXY_HOPS=7 ORGTABLE_TIMEZONE=Europe/Madrid \
            ORGTABLE_AUDIT_RETENTION_DAYS=45 ORGTABLE_SOURCE_URL=https://example.org/fork \
            docker compose config)"
          grep -q 'CRON_SECRET: probe' <<<"$config"
          grep -q 'TRUSTED_PROXY_HOPS: "7"' <<<"$config"
          grep -q 'ORGTABLE_TIMEZONE: Europe/Madrid' <<<"$config"
          grep -q 'ORGTABLE_AUDIT_RETENTION_DAYS: "45"' <<<"$config"
          grep -q 'ORGTABLE_SOURCE_URL: https://example.org/fork' <<<"$config"

      # La licencia vigente es AGPL-3.0-or-later con un término de atribución (sección
      # 7(b)) al final de LICENSE (ver docs/DECISIONES.md, 2026-10-14). Falla si
      # package.json y LICENSE dejan de coincidir, si se pierde el término de atribución o
      # si reaparecen restos de la licencia propietaria fuera del registro histórico.
      - name: Check license
        run: |
          grep -q '"license": "AGPL-3.0-or-later"' package.json
          head -n 1 LICENSE | grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE'
          grep -q 'ADDITIONAL TERMS UNDER SECTION 7(b) OF THE GNU AGPL' LICENSE
          grep -q 'Created by Aimar (github.com/Aimarmndz)' LICENSE
          if git grep -n -E 'MARA-KASSA|UNLICENSED|[Tt]odos los derechos reservados' -- \
            ':!docs/decisions/0005-agpl.md' ':!docs/decisions/0016-licencia-propietaria.md' \
            ':!docs/DECISIONES.md' ':!.github/workflows/ci.yml' ':!CLAUDE.md'; then
            echo "Quedan restos de la licencia anterior (la vigente es la de LICENSE)." >&2
            exit 1
          fi

      # Instala la versión de pnpm fijada en `packageManager` (package.json).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Falla si hay vulnerabilidades altas o críticas en las dependencias de producción.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
