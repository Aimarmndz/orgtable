# orgtable — production orchestration. The `app` image is built locally.
# Variables come from .env (install.sh generates it with random secrets).
# See docs/installation.md and docs/docker.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orgtable
    # Postgres is NOT exposed to the host: it is only reachable from the internal network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      # Attachments directory (persistent volume). See docs/attachments.md.
      ORGTABLE_UPLOAD_DIR: ${ORGTABLE_UPLOAD_DIR:-/data/uploads}
      # Real time across several replicas (0 = in-process). See docs/realtime.md.
      ORGTABLE_REALTIME_PG_NOTIFY: ${ORGTABLE_REALTIME_PG_NOTIFY:-0}
      # Secret for the reminders endpoint. Empty = endpoint disabled (503). The container
      # only sees the variables listed here: without this line, the CRON_SECRET in .env
      # would never reach the app. See docs/reminders.md.
      CRON_SECRET: ${CRON_SECRET:-}
      # Trusted proxies in front of the app (0 = X-Forwarded-For is ignored and the login
      # rate limit is per email). See docs/self-hosting.md.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Time zone for dates formatted by the server. See docs/installation.md.
      ORGTABLE_TIMEZONE: ${ORGTABLE_TIMEZONE:-Atlantic/Canary}
      # Days the audit log is kept before POST /api/cron/maintenance deletes it.
      # Empty = 90. See docs/privacy.md.
      ORGTABLE_AUDIT_RETENTION_DAYS: ${ORGTABLE_AUDIT_RETENTION_DAYS:-}
      # The app's "Source code" link (AGPL section 13). Empty = the original repository;
      # if you deploy a modified version, put your fork here.
      ORGTABLE_SOURCE_URL: ${ORGTABLE_SOURCE_URL:-}
      # Public landing at / (auto = only while sign-up is open; on; off) and the install
      # script it tells visitors to run. Empty = auto and the original installer. See
      # docs/landing.md.
      ORGTABLE_LANDING: ${ORGTABLE_LANDING:-}
      ORGTABLE_INSTALL_URL: ${ORGTABLE_INSTALL_URL:-}
      # Email (optional): password reset links and employee invitations. Empty = off.
      # See docs/email.md.
      ORGTABLE_SMTP_URL: ${ORGTABLE_SMTP_URL:-}
      ORGTABLE_MAIL_FROM: ${ORGTABLE_MAIL_FROM:-}
      ORGTABLE_PUBLIC_URL: ${ORGTABLE_PUBLIC_URL:-}
    volumes:
      - uploads:/data/uploads
    ports:
      # APP_PORT also accepts "127.0.0.1:3000" to publish the app on localhost only
      # (behind a reverse proxy). See docs/self-hosting.md.
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1 (not "localhost"): inside the container localhost resolves to IPv6
      # ::1, but the standalone server listens on IPv4 0.0.0.0.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orgtable

volumes:
  pgdata:
  uploads:

networks:
  orgtable:
    driver: bridge
