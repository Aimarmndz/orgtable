# orgtable — orquestación de producción. La imagen `app` se construye localmente.
# Las variables vienen de .env (lo genera install.sh con secretos aleatorios).
# Ver docs/installation.md y docs/docker.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orgtable
    # Postgres NO se expone al host: solo es accesible desde la red interna.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      # Directorio de adjuntos (volumen persistente). Ver docs/attachments.md.
      ORGTABLE_UPLOAD_DIR: ${ORGTABLE_UPLOAD_DIR:-/data/uploads}
      # Tiempo real entre varias réplicas (0 = en proceso). Ver docs/realtime.md.
      ORGTABLE_REALTIME_PG_NOTIFY: ${ORGTABLE_REALTIME_PG_NOTIFY:-0}
      # Secreto del endpoint de recordatorios. Vacío = endpoint desactivado (503). El
      # contenedor solo ve las variables listadas aquí: sin esta línea, el CRON_SECRET del
      # .env no llegaría a la app. Ver docs/reminders.md.
      CRON_SECRET: ${CRON_SECRET:-}
      # Proxies de confianza delante de la app (0 = se ignora X-Forwarded-For y el límite
      # de login va por email). Ver docs/self-hosting.md.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Zona horaria de las fechas que formatea el servidor. Ver docs/installation.md.
      ORGTABLE_TIMEZONE: ${ORGTABLE_TIMEZONE:-Atlantic/Canary}
    volumes:
      - uploads:/data/uploads
    ports:
      # APP_PORT admite también «127.0.0.1:3000» para publicar la app solo en local
      # (detrás de un proxy inverso). Ver docs/self-hosting.md.
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1 (no "localhost"): dentro del contenedor localhost resuelve a IPv6
      # ::1, pero el servidor standalone escucha en IPv4 0.0.0.0.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orgtable

volumes:
  pgdata:
  uploads:

networks:
  orgtable:
    driver: bridge
